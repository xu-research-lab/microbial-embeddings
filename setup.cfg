[bumpversion]
current_version = 1.0.0
commit = True
tag = True

[bumpversion:file:setup.py]
search = version='{current_version}'
replace = version='{new_version}'

[bumpversion:file:membed/__init__.py]
search = __version__ = '{current_version}'
replace = __version__ = '{new_version}'

[bdist_wheel]
universal = 1

[flake8]
exclude = docs,.ipynb_checkpoints
# Research code style: long lines, whitespace noise and ambiguous names are tolerated.
ignore =
    E124,E127,E128,E202,E221,E225,E226,E231,E241,E251,E261,E262,E302,E303,E305,
    E501,E741,F841,W291,W292,W293,W503
